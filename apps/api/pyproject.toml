[project]
name = "cairn-api"
version = "0.0.0"
description = "CAIRN API — FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy[asyncio]>=2.0.43",
    "asyncpg>=0.30.0",
    # psycopg 3 is used by Alembic only; the app itself is async via asyncpg.
    "psycopg[binary]>=3.2.9",
    "alembic>=1.16.4",
    "pydantic>=2.11.7",
    "pydantic-settings>=2.10.1",
    "argon2-cffi>=25.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cairn_api"]
