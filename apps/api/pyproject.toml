[project]
name = "cairn-api"
version = "0.0.0"
description = "CAIRN API — FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy[asyncio]>=2.0.43",
    "asyncpg>=0.30.0",
    # psycopg 3 is used by Alembic only; the app itself is async via asyncpg.
    "psycopg[binary]>=3.2.9",
    "alembic>=1.16.4",
    "pydantic>=2.11.7",
    "pydantic-settings>=2.10.1",
    "argon2-cffi>=25.1.0",
    "fastapi>=0.118",
    # Imported directly by api/errors.py and api/middleware.py —
    # BaseHTTPMiddleware, StarletteHTTPException and the ASGI types are not
    # re-exported by FastAPI. Declared rather than relied on as FastAPI's
    # transitive dependency: an undeclared import works right up until the day
    # FastAPI widens or drops its own pin, and then it breaks in a module that
    # has not been touched.
    "starlette>=0.47",
    "uvicorn[standard]>=0.37",
    "structlog>=25.4",
    "email-validator>=2.2",
    "google-cloud-pubsub>=2.31",
    # pipeline/credentials.py imports google.auth directly to obtain and refresh
    # an access token for Vertex. That package arrives transitively with
    # google-cloud-pubsub today, which means the model adapter's credentials
    # depend on the *queue* backend's dependency tree — a coupling nobody chose
    # and nothing records. Declared so it survives dropping Pub/Sub.
    "google-auth>=2.35",
    "pyjwt[crypto]>=2.10",
    "httpx>=0.28",
    # pgvector's SQLAlchemy type, so embedding columns are typed rather than
    # hand-cast strings. The extension itself is already required by the
    # initial migration (md/06 §4.4).
    "pgvector>=0.4",
    "opentelemetry-api>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cairn_api"]

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1",
    "httpx>=0.28",
    # pgvector's SQLAlchemy type, so embedding columns are typed rather than
    # hand-cast strings. The extension itself is already required by the
    # initial migration (md/06 §4.4).
    "pgvector>=0.4",
]
