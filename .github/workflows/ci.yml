name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs — fast feedback is the point (standards §7.1)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default. Without this, every job — including ones that
# run `pnpm install` and `uv sync`, executing arbitrary dependency lifecycle
# scripts — receives whatever the repository default is, which in many orgs is
# read/write. A compromised transitive dependency could then push to the repo.
permissions:
  contents: read

env:
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.12"

jobs:
  # -------------------------------------------------------------------------
  # Fast gate: must finish in under 2 minutes (standards §7)
  # -------------------------------------------------------------------------
  quality-ts:
    name: TypeScript — lint, format, types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Turborepo needs history for affected detection

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        # Includes @cairn/api-client, whose types are generated from the API's
        # OpenAPI document. This is the half of the contract check that catches
        # a *breaking* change: rename a Pydantic field and the client's
        # consumers stop compiling here.
        #
        # The other half — that the committed document still matches the routes
        # — is asserted by test_openapi.py in the Python job. Regenerating here
        # instead would defeat both: a schema generated on the fly always
        # agrees with itself.
        run: pnpm typecheck

  quality-py:
    name: Python — lint, format, types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Lint
        run: uv run ruff check --output-format=github .

      - name: Format check
        run: uv run ruff format --check .

      - name: Typecheck
        run: uv run mypy .

  # -------------------------------------------------------------------------
  # Tests
  # -------------------------------------------------------------------------
  cloudflare-worker:
    name: Frontend — Cloudflare Worker builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build the Worker bundle
        # The deployment target is a founder decision (md/06 §1) and the path is
        # named in §2.1: Next.js on Workers via OpenNext. `next build` passing
        # says nothing about whether the app bundles for workerd — a Node API
        # used in the wrong place fails here and nowhere else.
        #
        # This job exists because OpenNext states it is not fully compatible
        # with Windows and recommends WSL, so the developer machine this was
        # written on cannot run it. Rather than leave the claim unverified, it
        # is verified on Linux, on every push.
        run: pnpm --filter @cairn/web exec opennextjs-cloudflare build

      - name: Check the bundle against the Workers size limit
        # 3 MiB on the free plan, 10 MiB paid (md/06 §2.2). Bundle discipline is
        # a hard constraint rather than a preference, and discovering a breach
        # at deploy time means discovering it during an incident.
        run: |
          size=$(stat -c %s apps/web/.open-next/worker.js)
          limit=$((3 * 1024 * 1024))
          echo "worker.js: $size bytes (limit $limit)"
          test "$size" -lt "$limit"

  test-ts:
    name: TypeScript — tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Test
        # The coverage variant, not the plain one: the thresholds in each
        # package's vitest config were configured and never enforced, because
        # nothing in CI ran a command that reads them.
        run: pnpm test:coverage

  test-py:
    name: Python — tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Integration tests need a real PostgreSQL. Without this, every test
    # marked `integration` silently skips and CI reports green while the
    # tenant-isolation suite — the most important safety net in the system —
    # never runs. conftest.py refuses to skip when CI=true, so a missing
    # service now fails loudly instead.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: cairn
          POSTGRES_PASSWORD: cairn_local_dev
          POSTGRES_DB: cairn
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cairn"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      # The generated-types drift test shells out to pnpm. Without it on PATH
      # the test skips itself and nothing in CI detects Python-model to
      # TypeScript drift.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Start the Pub/Sub emulator
        # Run as a step rather than a `services:` container: the emulator image
        # has no long-running entrypoint of its own, so it needs an explicit
        # command. Without it the adapter tests skip in CI and the production
        # broker is only ever exercised on a developer's laptop.
        run: |
          docker run -d --name pubsub -p 8085:8085 \
            gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators \
            gcloud beta emulators pubsub start --project=cairn-local --host-port=0.0.0.0:8085
          for _ in $(seq 1 30); do
            curl -sf http://localhost:8085 && break
            sleep 1
          done

      - name: Create test databases
        run: |
          export PGPASSWORD=cairn_local_dev
          psql -h localhost -U cairn -d postgres -c "CREATE DATABASE cairn_test"
          psql -h localhost -U cairn -d postgres -c "CREATE DATABASE cairn_migrations"

      - name: Test
        # CI=true makes conftest fail rather than skip when the database is
        # unreachable, so a broken service block cannot hide behind a green run.
        #
        # --cov here rather than in addopts: it slows every local run, and a
        # threshold failing on a developer's partial test selection trains
        # people to pass --no-cov, which defeats the point. Enforced where it
        # matters instead.
        env:
          # Presence of this variable is how the Pub/Sub client library and the
          # adapter tests find the emulator. Absent, those tests skip — which is
          # honest locally and would be a silent gap in CI.
          PUBSUB_EMULATOR_HOST: localhost:8085
        run: uv run pytest --cov=apps/api/src/cairn_api --cov-report=term-missing

      # ---------------------------------------------------------------------
      # Evaluation. Three steps, because they answer three different questions
      # and a single red X would not say which one failed.
      #
      # Separate from the tests for the same reason: "the evaluation gate
      # blocked" and "a unit test broke" are different conversations, and
      # collapsing them means the first gets diagnosed as the second.
      # ---------------------------------------------------------------------

      - name: Evaluation gate — harness can pass
        # ReferencePipeline scores perfectly by construction. This proves the
        # harness, the dataset and the gate all work — so when the real run
        # below fails, the instrument is not a suspect.
        #
        # On its own this proved nothing about the product, and for several
        # steps it was the only evaluation CI ran. That is the finding this
        # block exists to close.
        run: uv run python -m cairn_api.evaluation.runner --pipeline reference

      - name: Evaluation gate — harness can fail
        # The negative control. BrokenPipeline fails one metric per case on
        # purpose, so this step asserts a *non-zero* exit: a gate that has never
        # blocked anything is a gate that might not be able to, and its failure
        # mode is reporting success.
        #
        # `!` rather than `continue-on-error`, which would pass on either
        # outcome and therefore assert nothing.
        run: |
          ! uv run python -m cairn_api.evaluation.runner --pipeline broken

      - name: Evaluation gate — the product
        # UnderstandingPipeline, Stages 1 to 4. The run that says something
        # about what customers would receive.
        #
        # Driven by evaluation/scripted.py because no model credentials exist
        # here. That provider is deliberately the adversary's best case — it
        # complies with every injection it is shown — so these numbers are a
        # floor on the pipeline's machinery rather than a measure of model
        # quality. Its limits are documented in scripted.py, not implied here.
        #
        # Compared against baseline-real.json, which is a separate file from the
        # reference pipeline's baseline: one shared file would either make the
        # real pipeline look like a permanent catastrophic regression against
        # the stand-in's 1.0s, or stop the stand-in from proving 100% is
        # reachable.
        #
        # KNOWN BLOCKED. This step fails today, on case coverage 14/15 against a
        # 95% floor. Left failing on purpose: the thresholds were not weakened
        # to make it green, and a build that is honestly red about a real
        # measurement is worth more than one that is green about a stand-in.
        # See baseline-real.json for the numbers and the diagnosis.
        run: uv run python -m cairn_api.evaluation.runner --pipeline real

  test-e2e:
    name: Browser — end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # The one job that runs the product rather than a piece of it: a real
    # browser, a real session cookie, a real cross-origin call to a real API on
    # a real PostgreSQL. Everything else in `apps/web` is jsdom with a mocked
    # client, which cannot see the auth gate, the cookie, or row-level
    # security — the three things a regression here would break first.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: cairn
          POSTGRES_PASSWORD: cairn_local_dev
          POSTGRES_DB: cairn
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cairn"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          uv sync --all-extras --dev

      - name: Migrate
        run: cd apps/api && uv run alembic upgrade head

      - name: Seed
        # `scripted` here as well as when serving. The seed runs the *production*
        # understanding handler over the webhook deliveries it writes, so
        # without a model backend it correctly extracts nothing and the test
        # would open an empty Brief.
        env:
          CAIRN_MODEL_BACKEND: scripted
        run: uv run python -m cairn_api.db.seed

      - name: Type-check the browser suite
        # Not covered by `pnpm typecheck`: the suite is not shipped, so it is
        # not in the app's tsconfig `include`. It has a project of its own
        # (apps/web/e2e/tsconfig.json) with the same strictness.
        run: pnpm --filter @cairn/web exec tsc --noEmit -p e2e/tsconfig.json

      - name: Install the browser
        # Chromium only, matching the single project in playwright.config.ts.
        # `--with-deps` installs the system libraries the runner image lacks.
        run: pnpm --filter @cairn/web exec playwright install --with-deps chromium

      - name: Test
        # The API and the web app are started by `webServer` in
        # playwright.config.ts rather than here, so the same command reproduces
        # this run on a laptop. `CI` makes it refuse to reuse a stray server and
        # refuse a stray `test.only`.
        run: pnpm --filter @cairn/web e2e

      - name: Upload the trace of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-trace
          path: apps/web/test-results/
          retention-days: 7

  # -------------------------------------------------------------------------
  # Container
  # -------------------------------------------------------------------------
  docker-build:
    name: Container — build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          # Never pushed. There is no registry and no deployment yet
          # (infra/README.md) — but an image that is only built when someone
          # deploys is one that breaks silently in between, and the break is
          # discovered during the deploy. Building it on every pull request
          # keeps the Dockerfile honest for free.
          push: false
          load: true
          tags: cairn:ci
          # GitHub Actions cache, so the dependency layer is not rebuilt on
          # every run. mode=max caches the intermediate build stage too, which
          # is the expensive one — the default only caches the final stage,
          # which in a multi-stage build is the cheap half.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify both entrypoints import
        # A build that succeeds proves the layers assembled, not that the
        # application is in them. This is the check that would have caught an
        # empty virtualenv from a `uv sync` that resolved to nothing in a
        # workspace whose root declares no dependencies.
        #
        # Imports rather than starts: starting either process needs a database,
        # and a smoke test that needs the world is one that gets deleted the
        # first time it flakes. An import failure is the failure mode a bad
        # image actually has.
        run: |
          docker run --rm --entrypoint python cairn:ci \
            -c "import cairn_api.api.app, cairn_api.jobs.main; print('both entrypoints import')"

      - name: Verify the image does not run as root
        # Asserted rather than trusted. A later edit that adds a RUN needing
        # root, and moves USER to fix it, changes nothing observable — this is
        # what notices.
        run: |
          user="$(docker run --rm --entrypoint id cairn:ci -un)"
          echo "runtime user: $user"
          [ "$user" = "cairn" ]

      - name: Verify no dev dependencies shipped
        # `--no-dev` is one flag away from being dropped. A production image
        # containing pytest is a code-execution primitive with a friendly CLI.
        run: |
          if docker run --rm --entrypoint python cairn:ci \
              -c "import pytest" 2>/dev/null; then
            echo "::error::pytest is present in the production image"
            exit 1
          fi
          echo "dev dependencies are absent"

  # -------------------------------------------------------------------------
  # Security — dependency and secret scanning (standards §9)
  # -------------------------------------------------------------------------
  security:
    name: Security scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
      # gitleaks-action lists the PR's commits through the API on pull_request
      # events; without this it dies with 'Resource not accessible by
      # integration' before scanning anything - a failure that reads as a leak
      # and is actually a 403.
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # -------------------------------------------------------------------------
  # Single required status for branch protection
  # -------------------------------------------------------------------------
  ci-passed:
    name: CI passed
    runs-on: ubuntu-latest
    # `test-e2e` is required like everything else, and is expected to fail today.
    # It is red on a real product gap it found, not on a flaw of its own: nothing
    # in the application ever links a `Person` to a `User`, so My Week is empty
    # for every account and every correction is a 403 — see the note at the foot
    # of apps/web/e2e/record-correction.e2e.ts. Left required on the same
    # reasoning as the evaluation gate above: a job that is honestly red about a
    # real measurement is worth more than one nobody is obliged to look at.
    needs:
      [
        quality-ts,
        quality-py,
        cloudflare-worker,
        test-ts,
        test-py,
        test-e2e,
        docker-build,
        security,
      ]
    if: always()
    steps:
      - name: Verify every job succeeded
        # Checks for success rather than absence-of-failure. A skipped job
        # reports `"result": "skipped"` and would have passed the previous
        # check — so a `paths` filter, a disabled action, or an `if` condition
        # added later could turn the secret scan off while branch protection
        # still reported green.
        run: |
          results='${{ toJSON(needs) }}'
          echo "$results"
          if echo "$results" | grep -q '"result": *"[^s]'; then
            echo "::error::A required job did not succeed."
            exit 1
          fi
          if echo "$results" | grep -q '"result": *"skipped"'; then
            echo "::error::A required job was skipped. Skipped is not passed."
            exit 1
          fi
          echo "All required jobs succeeded."
