[project]
name = "cairn"
version = "0.0.0"
description = "CAIRN — an AI-native team operating system"
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
# services/* are added as they are built (md/16-build-steps.md Steps 11, 15)
members = ["apps/api"]

[tool.uv.sources]
cairn-api = { workspace = true }

[dependency-groups]
dev = [
    # Workspace members are installed in editable mode so tests can import them
    "cairn-api",
    "ruff>=0.12.9",
    "mypy>=1.17.1",
    "pytest>=8.4.1",
    "pytest-cov>=6.2.1",
    "pytest-asyncio>=1.1.0",
]

# ---------------------------------------------------------------------------
# Ruff — replaces flake8, isort, pyupgrade and more in one fast tool.
# See md/17-engineering-standards.md §6.3
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv", "__pycache__"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "TID",    # flake8-tidy-imports
    "RUF",    # ruff-specific
    "S",      # flake8-bandit (security)
    "ASYNC",  # flake8-async
    "LOG",    # flake8-logging
    "G",      # flake8-logging-format
]
ignore = [
    "E501",   # line length — formatter handles this
    "B008",   # function call in default arg — required by FastAPI's Depends()
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]  # assert is expected in tests
"**/test_*.py" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["cairn"]

# ---------------------------------------------------------------------------
# mypy — strict from day one. Relaxing later is easy; tightening is not.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_return_any = true
disallow_untyped_defs = true
disallow_any_unimported = true
no_implicit_optional = true
show_error_codes = true
exclude = ["\\.venv", "build", "dist"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["apps/api", "services"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
]
markers = [
    "integration: tests that require a database or external service",
    "isolation: tenant-isolation tests — these must never be skipped",
]

[tool.coverage.run]
branch = true
omit = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
# Coverage is a floor, never a target — see md/17-engineering-standards.md §4.1
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
