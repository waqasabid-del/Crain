[project]
name = "cairn"
version = "0.0.0"
description = "CAIRN — an AI-native team operating system"
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
# services/* are added as they are built (md/16-build-steps.md Steps 11, 15)
members = ["apps/api"]

[tool.uv.sources]
cairn-api = { workspace = true }

[dependency-groups]
dev = [
    # Workspace members are installed in editable mode so tests can import them
    "cairn-api",
    "ruff>=0.12.9",
    "mypy>=1.17.1",
    "pytest>=8.4.1",
    "pytest-cov>=6.2.1",
    "pytest-asyncio>=1.1.0",
    "greenlet>=3.2.4",
    # Runs the FastAPI lifespan around httpx-driven API tests. Declared here
    # rather than installed ad hoc: an undeclared test dependency works until
    # the next `uv sync` prunes it, and then the whole suite fails to collect
    # for a reason unrelated to any change.
    "asgi-lifespan>=2.1",
    # `pytest.mark.anyio` and `anyio.run(...)` in test_pipeline.py. The marker is
    # registered by anyio's pytest plugin, and `--strict-markers` is on — so
    # without anyio installed the suite does not merely fail, it fails at
    # collection with "unknown marker", which reads like a configuration error
    # rather than a missing package. It arrives transitively via httpx and
    # starlette today; the same audit that found asgi-lifespan found this.
    "anyio>=4.6",
]

# ---------------------------------------------------------------------------
# Ruff — replaces flake8, isort, pyupgrade and more in one fast tool.
# See md/17-engineering-standards.md §6.3
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv", "__pycache__"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "TID",    # flake8-tidy-imports
    "RUF",    # ruff-specific
    "S",      # flake8-bandit (security)
    "ASYNC",  # flake8-async
    "LOG",    # flake8-logging
    "G",      # flake8-logging-format
]
ignore = [
    "E501",   # line length — formatter handles this
    "B008",   # function call in default arg — required by FastAPI's Depends()
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]  # assert is expected in tests
"**/test_*.py" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["cairn"]

# ---------------------------------------------------------------------------
# mypy — strict from day one. Relaxing later is easy; tightening is not.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_return_any = true
disallow_untyped_defs = true
disallow_any_unimported = true
no_implicit_optional = true
show_error_codes = true
exclude = ["\\.venv", "build", "dist"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# google-cloud-pubsub ships no type information (no py.typed marker), so mypy
# cannot follow it. Declared here rather than with inline ignores, so the
# exemption is one visible decision instead of a scattering of comments — and so
# it disappears in one edit if the library ever ships stubs.
[[tool.mypy.overrides]]
module = ["google.cloud.*", "google.api_core.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["apps/api", "services"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
# The engine fixture is session-scoped and holds a connection pool bound to the
# loop that created it. Without matching loop scopes, each test gets a fresh
# loop and asyncpg raises "attached to a different loop".
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
]
markers = [
    "integration: tests that require a database or external service",
    "isolation: tenant-isolation tests — these must never be skipped",
    "slow: tests that spawn subprocesses or rebuild schema",
]

[tool.coverage.run]
branch = true
omit = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
# Coverage is a floor, never a target — see md/17-engineering-standards.md §4.1
fail_under = 80
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
