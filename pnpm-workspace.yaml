# pnpm workspaces + catalogs.
# Catalogs pin shared dependency versions in one place so packages cannot drift
# apart — see md/17-engineering-standards.md §6.3.

packages:
  - "apps/*"
  - "packages/*"

catalog:
  # Core
  typescript: ^5.9.2
  "@types/node": ^24.3.0

  # Tooling
  turbo: ^2.5.6
  prettier: ^3.6.2
  lefthook: ^1.12.2
  "@commitlint/cli": ^19.8.1
  "@commitlint/config-conventional": ^19.8.1

  # Linting
  eslint: ^9.33.0
  "@eslint/js": ^9.33.0
  typescript-eslint: ^8.39.0
  eslint-config-prettier: ^10.1.8
  "eslint-plugin-jsx-a11y": ^6.10.2

  # Testing
  vitest: ^3.2.4
  "@vitest/coverage-v8": ^3.2.4
