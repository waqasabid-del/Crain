# pnpm workspaces + catalogs.
# Catalogs pin shared dependency versions in one place so packages cannot drift
# apart — see md/17-engineering-standards.md §6.3.

packages:
  - "apps/*"
  - "packages/*"

catalog:
  # Core
  typescript: ^5.9.2
  "@types/node": ^24.3.0

  # Tooling
  turbo: ^2.5.6
  prettier: ^3.6.2
  lefthook: ^1.12.2
  "@commitlint/cli": ^19.8.1
  "@commitlint/config-conventional": ^19.8.1

  # Linting
  eslint: ^9.33.0
  "@eslint/js": ^9.33.0
  typescript-eslint: ^8.39.0
  eslint-config-prettier: ^10.1.8
  "eslint-plugin-jsx-a11y": ^6.10.2

  # Testing
  vitest: ^3.2.4
  "@vitest/coverage-v8": ^3.2.4

  # UI / design system
  react: ^19.1.1
  react-dom: ^19.1.1
  "@types/react": ^19.1.10
  "@types/react-dom": ^19.1.7
  clsx: ^2.1.1
  jsdom: ^26.1.0
  "@testing-library/react": ^16.3.0
  "@testing-library/jest-dom": ^6.8.0
  "@testing-library/user-event": ^14.6.1
  "vitest-axe": ^0.1.0
  vite: ^7.1.3
  "@vitejs/plugin-react": ^5.0.0
  # The application framework. md/06 §1 is a founder decision — frontend on
  # Cloudflare — and §2.1 names the deployment path: Next.js on Workers via
  # OpenNext, not Pages, because Cloudflare's own recommendation changed and
  # choosing Pages now would mean migrating later.
  next: ^15.5.0
  "@opennextjs/cloudflare": ^1.6.0
  wrangler: ^4.34.0

  # Routing lives in the app, not the design system — a design system that knows
  # about routes cannot be reviewed in isolation. Catalogued anyway, so a second
  # frontend surface (the back-office of md/15 §4.3) cannot drift onto a
  # different major version of the router.
  react-router-dom: ^7.8.1
  json-schema-to-typescript: ^15.0.4

  # API client codegen
  openapi-typescript: ^7.9.1
